<title>STUFFT Brand Portal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap">
<style>
/* Layout: the MIXH portal system. Fixed rail on the left, one page per section, sharp corners.
   STUFFT layer: Sand ground, Ocean ink, Sunset (maroon) as the rare hero accent, Sky as air. */
:root{
  --ground:#F3EDE1; --surface:#FBF8F2; --rail:#F3EDE1; --tint:#E8DCC4;
  --ink:#123E5E; --ink-2:#3E5566; --ink-3:#6E7F8A;
  --line:#E4D9C5; --line-2:#CDBFA3; --accent:#800000; --focus:#800000; --ok:#2E6B4A; --bad:#800000;
  --toast-bg:#123E5E; --toast-ink:#F3EDE1;
  --display:"Anton",Impact,"Arial Narrow",sans-serif;
  --sans:"DM Sans",Arial,Helvetica,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0B2233; --surface:#102B40; --rail:#0D2537; --tint:#14344C;
    --ink:#F3EDE1; --ink-2:#C7D3DB; --ink-3:#8EA2B0;
    --line:#183A53; --line-2:#28506D; --accent:#E8A093; --focus:#E8A093; --ok:#8FD6AE; --bad:#E8A093;
    --toast-bg:#E8DCC4; --toast-ink:#123E5E;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0B2233; --surface:#102B40; --rail:#0D2537; --tint:#14344C;
  --ink:#F3EDE1; --ink-2:#C7D3DB; --ink-3:#8EA2B0;
  --line:#183A53; --line-2:#28506D; --accent:#E8A093; --focus:#E8A093; --ok:#8FD6AE; --bad:#E8A093;
  --toast-bg:#E8DCC4; --toast-ink:#123E5E;
}
*,*::before,*::after{box-sizing:border-box;border-radius:0}
html{scroll-behavior:smooth}
body{margin:0;background:var(--ground);color:var(--ink);font:400 16px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-weight:400;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.label{font:700 11px/1.45 var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--accent)}
.label.mute{color:var(--ink-3)}
svg.logo{display:block;width:100%;height:auto}
.num{font-variant-numeric:tabular-nums}

/* shell */
.app{display:grid;grid-template-columns:288px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;background:var(--rail);border-right:1px solid var(--line-2);padding:28px 26px 24px;display:flex;flex-direction:column;gap:34px;overflow-y:auto}
.rail-brand{display:flex;align-items:center;gap:14px;text-decoration:none;color:var(--ink)}
.rail-logo{width:96px;flex:none;color:var(--accent)}
.rail-tag{font:700 10px/1.5 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding-left:14px;border-left:1px solid var(--line-2)}
.nav{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.nav a{display:flex;justify-content:space-between;align-items:baseline;padding:12px 2px;border-bottom:1px solid var(--line);color:var(--ink-3);text-decoration:none;font:500 15px/1.2 var(--sans);transition:color .15s,padding .15s}
.nav a small{font:500 10.5px var(--sans);letter-spacing:.08em;color:var(--ink-3)}
.nav a:hover{color:var(--ink)}
.nav a.on{color:var(--ink);padding-left:12px;box-shadow:inset 3px 0 0 var(--accent)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.rail-foot>button{width:100%;text-align:left;padding:9px 12px;border:1px solid var(--line-2);background:var(--surface);font:500 13px var(--sans);display:flex;justify-content:space-between;color:var(--ink)}
.rail-foot>button:hover{border-color:var(--ink)}
.theme{display:inline-flex;border:1px solid var(--line-2);padding:3px;background:var(--surface);width:max-content;margin-top:6px}
.theme button{border:0;background:transparent;padding:6px 12px;font:700 10px/1 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px}
.theme button i{width:10px;height:10px;border-radius:50%;border:1px solid var(--ink-3);display:inline-block}
.theme button[data-mode="light"] i{background:#E8DCC4}
.theme button[data-mode="dark"] i{background:#123E5E}
.theme button[aria-pressed="true"]{background:var(--ink);color:var(--ground)}
.copyright{font:500 10.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-top:8px}
main{min-width:0}
.page{padding-block:56px 72px;padding-left:max(20px,min(5vw,72px),env(safe-area-inset-left,0px));padding-right:max(20px,min(5vw,72px),env(safe-area-inset-right,0px));max-width:1280px;display:flex;flex-direction:column;gap:40px}
.page[hidden],.home[hidden]{display:none!important}

/* page head */
.sec-head{display:flex;flex-direction:column;gap:16px;padding-bottom:30px;border-bottom:1px solid var(--ink)}
.sec-head h2{font:400 clamp(44px,6vw,84px)/.98 var(--display);text-transform:uppercase;letter-spacing:.005em;color:var(--ink)}
.sec-head h2 em{font-style:normal;color:var(--accent)}
.sec-head p{font-size:17px;line-height:1.6;color:var(--ink-2);max-width:60ch}
.sub{font:400 30px/1.05 var(--display);text-transform:uppercase;letter-spacing:.01em;margin-top:10px}
.intro{color:var(--ink-2);max-width:64ch;margin-top:-22px}
.note{font-size:13px;color:var(--ink-3);max-width:80ch}

/* home */
.home{min-height:100vh;background:#800000;color:#E8DCC4;display:grid;place-items:center;position:relative;padding:48px 20px;overflow:hidden}
.home-logo{width:min(52%,560px);color:#E8DCC4}
.home-line{position:absolute;left:50%;top:calc(50% + min(19vw,210px));transform:translateX(-50%);font:400 clamp(20px,2.4vw,30px)/1 var(--display);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.home-foot{position:absolute;left:max(20px,4vw);right:max(20px,4vw);bottom:28px;display:flex;justify-content:space-between;gap:16px;font:700 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:#E8C9C0;flex-wrap:wrap}
.home-enter{position:absolute;right:max(20px,4vw);top:28px;color:#E8DCC4;font:700 11px var(--sans);letter-spacing:.16em;text-transform:uppercase;text-decoration:none;border:1px solid #B65A4F;padding:10px 14px}
.home-enter:hover{background:#E8DCC4;color:#800000}

/* chips & buttons */
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--surface);padding:4px 10px;font:500 12px var(--sans);font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--ink)}
.chip:hover{border-color:var(--ink)}
.chip svg{width:12px;height:12px;opacity:.55}
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);padding:8px 12px;font:700 12.5px/1 var(--sans);text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn.solid{background:#800000;border-color:#800000;color:#F3EDE1}
.btn.solid:hover{background:#5E0000}
.btn[hidden]{display:none!important}

/* overview */
.statement{background:#800000;color:#F3EDE1;padding:clamp(24px,4vw,52px);display:flex;flex-direction:column;gap:22px;container-type:inline-size}
.statement .label{color:#E8C9C0}
.statement-line{font:400 clamp(48px,12cqw,140px)/.92 var(--display);text-transform:uppercase}
.statement-lead{font-size:clamp(17px,2.2cqw,21px);line-height:1.5;max-width:46ch;color:#F3E2DC}
.onepage{display:grid;grid-template-columns:180px minmax(0,1fr);border:1px solid var(--line-2);background:var(--surface)}
.onepage>*{padding:16px 20px;border-bottom:1px solid var(--line)}
.onepage>*:nth-last-child(-n+2){border-bottom:0}
.onepage dt{font:700 12px/1.6 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--accent);border-right:1px solid var(--line)}
.onepage dd{margin:0;font-size:17px;line-height:1.55}
.onepage dd.big{font:400 34px/1 var(--display);text-transform:uppercase;color:var(--accent)}
.manifesto{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:1px;background:var(--line-2);border:1px solid var(--line-2)}
.manifesto>div{background:var(--surface);padding:clamp(20px,3vw,36px);display:flex;flex-direction:column;gap:14px;justify-content:center;min-width:0}
.manifesto h3{font:400 clamp(34px,4vw,54px)/.98 var(--display);text-transform:uppercase}
.manifesto p{font-size:17px;color:var(--ink-2)}
.manifesto .stuff{font:400 30px/1 var(--display);text-transform:uppercase;color:var(--accent)}
.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line-2);border:1px solid var(--line-2)}
.facts div{background:var(--surface);padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.facts b{font-weight:500}

/* logo */
.logos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.logo-card{border:1px solid var(--line-2);background:var(--surface);display:flex;flex-direction:column;min-width:0}
.logo-card.wide{grid-column:span 2}
.logo-stage{aspect-ratio:4/3;display:grid;place-items:center;padding:16%;max-width:100%}
.logo-card.wide .logo-stage{aspect-ratio:auto;height:100%;min-height:240px;padding:9% 20%}
.logo-stage svg{max-width:100%;max-height:100%}
.logo-meta{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 14px;border-top:1px solid var(--line-2);flex-wrap:wrap}
.logo-meta strong{font-weight:700;font-size:14px;display:block}
.logo-meta p{font-size:13px;color:var(--ink-2);max-width:36ch}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.anatomy{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:1px;background:var(--line-2);border:1px solid var(--line-2)}
.anatomy>div{background:var(--surface);padding:24px;display:flex;flex-direction:column;gap:12px;justify-content:center;min-width:0}
.anatomy figure{margin:0;position:relative;color:#800000}
.anatomy .tag{position:absolute;font:700 10.5px var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink);background:var(--surface);border:1px solid var(--line-2);padding:3px 8px;white-space:nowrap}
.anatomy .bracket{position:absolute;border:1px dashed var(--ink-3)}
.anatomy h3,.clear h3{font:700 19px/1.25 var(--sans)}
.anatomy p,.clear p{font-size:14.5px;color:var(--ink-2)}
.clear{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:1px;background:var(--line-2);border:1px solid var(--line-2)}
.clear>div{background:var(--surface);padding:24px;display:flex;flex-direction:column;gap:12px;justify-content:center;min-width:0}
.clear-box{position:relative;align-self:center;width:min(100%,460px);padding:21%;outline:1px dashed var(--accent);background:repeating-linear-gradient(45deg,transparent 0 6px,var(--tint) 6px 12px)}
.clear-box>div{background:#E8DCC4;color:#800000;padding:0}
.clear-box .x{position:absolute;font:700 10px var(--sans);color:var(--accent);letter-spacing:.08em}
.clear-box .s-mark{position:absolute;left:0;top:0;width:21%;height:21%;border-right:1px solid var(--accent);border-bottom:1px solid var(--accent)}
.sizes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line-2);border:1px solid var(--line-2)}
.sizes>div{background:var(--surface);padding:18px 20px;display:flex;flex-direction:column;gap:10px;justify-content:space-between}
.sizes .demo{color:#800000;display:flex;align-items:flex-end;min-height:64px}
.sizes b{font:700 15px var(--sans)}
.sizes p{font-size:13.5px;color:var(--ink-2)}
.combos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.combo{border:1px solid var(--line-2);display:flex;flex-direction:column;min-width:0}
.combo .st{aspect-ratio:4/3;display:grid;place-items:center;padding:0 20%;max-width:100%}
.combo p{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 12px;background:var(--surface);border-top:1px solid var(--line-2);font:500 12px var(--sans);color:var(--ink-2);flex-wrap:wrap}
.combo p b{color:var(--ink);font-weight:700}
.donts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.dont{border:1px solid var(--line-2);background:var(--surface);display:flex;flex-direction:column;min-width:0}
.dont .st{aspect-ratio:16/10;display:grid;place-items:center;overflow:hidden;padding:0 24%;max-width:100%;position:relative}
.dont p{font-size:13.5px;padding:10px 12px;color:var(--ink-2);display:flex;gap:8px;border-top:1px solid var(--line-2)}
.dont p b{color:var(--bad);font-weight:700}

/* colour */
.swatches{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.sw{border:1px solid var(--line-2);background:var(--surface);display:flex;flex-direction:column;min-width:0}
.sw-face{all:unset;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;aspect-ratio:4/5;padding:16px;max-width:100%;box-sizing:border-box}
.sw-face:focus-visible{outline:2px solid var(--focus);outline-offset:-4px}
.sw-face .role{font:700 10.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.sw-face .nm{font:400 46px/1 var(--display);text-transform:uppercase;display:block}
.sw-face .hx{font:500 14px var(--sans);display:flex;justify-content:space-between;align-items:center;margin-top:8px;font-variant-numeric:tabular-nums}
.sw-face .hint{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;opacity:0;transition:opacity .15s}
.sw-face:hover .hint,.sw-face:focus-visible .hint{opacity:.85}
.sw-body{padding:14px;display:flex;flex-direction:column;gap:10px;border-top:1px solid var(--line-2);flex:1}
.sw-body>p{font-size:13.5px;color:var(--ink-2)}
.sw-codes{display:flex;flex-wrap:wrap;gap:6px}
.contrast{display:flex;gap:10px;font-size:12px;color:var(--ink-2);flex-wrap:wrap;margin-top:auto}
.contrast span{display:inline-flex;gap:5px;align-items:center}
.contrast i{font:500 11px var(--sans);font-style:normal;padding:1px 6px;border:1px solid var(--line-2)}
.contrast i.pass{color:var(--ok);border-color:currentColor}
.contrast i.fail{color:var(--ink-3)}
.names{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border:1px solid var(--line-2)}
.names>div{padding:clamp(18px,2.4vw,28px);display:flex;flex-direction:column;gap:10px;min-height:280px;justify-content:flex-end;container-type:inline-size;min-width:0}
.names .w{font:400 clamp(40px,26cqw,92px)/.9 var(--display);text-transform:uppercase}
.names p{font-size:14.5px;line-height:1.5;max-width:30ch}
.names .lb{font:700 10.5px var(--sans);letter-spacing:.14em;text-transform:uppercase;opacity:.8}
.mocks{columns:3 260px;column-gap:16px}
.mock{break-inside:avoid;margin:0 0 16px;border:1px solid var(--line-2);background:var(--surface);display:flex;flex-direction:column}
.mock img{display:block;width:100%;height:auto;max-width:100%;background:var(--tint)}
.mock figcaption{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line-2);font-size:13.5px;flex-wrap:wrap}
.mock figcaption b{font-weight:700;display:block}
.mock figcaption span{color:var(--ink-2)}
.wcards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.wcard{margin:0;border:1px solid var(--line-2);background:var(--surface);display:flex;flex-direction:column;min-width:0}
.wcard img{display:block;width:100%;height:auto;aspect-ratio:4/5;max-width:100%;object-fit:cover;background:var(--tint)}
.wcard figcaption{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 12px;border-top:1px solid var(--line-2);font-size:13.5px;flex-wrap:wrap}
.wcard figcaption b{font:400 20px/1 var(--display);text-transform:uppercase}
.prop{display:flex;height:120px;border:1px solid var(--line-2);overflow:hidden}
.prop div{display:flex;align-items:flex-end;padding:0 0 10px 12px;font:700 12px var(--sans);letter-spacing:.06em;min-width:0}
.prop-legend{display:flex;flex-wrap:wrap;gap:8px 20px;font-size:13px;color:var(--ink-2)}
.prop-legend span{display:inline-flex;gap:8px;align-items:center}
.prop-legend i{width:12px;height:12px;display:inline-block;box-shadow:inset 0 0 0 1px rgba(127,127,127,.45)}
.ramps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.ramp{border:1px solid var(--line-2);background:var(--surface);min-width:0}
.ramp h3{font:400 24px/1 var(--display);text-transform:uppercase;padding:14px 16px;border-bottom:1px solid var(--line-2);display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.ramp h3 .label{font-size:9.5px}
.step{all:unset;box-sizing:border-box;cursor:pointer;display:flex;justify-content:space-between;align-items:center;width:100%;padding:11px 14px;font:500 12px var(--sans);font-variant-numeric:tabular-nums}
.step:focus-visible{outline:2px solid var(--focus);outline-offset:-3px}
.step span:last-child{opacity:0;transition:opacity .15s;font-size:10px;letter-spacing:.1em;text-transform:uppercase}
.step:hover span:last-child,.step:focus-visible span:last-child{opacity:.85}
.step.core{padding-block:20px;font-weight:700}
.pairs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.pair{border:1px solid var(--line-2);display:flex;flex-direction:column;min-width:0}
.pair .st{aspect-ratio:1/1;padding:18px;display:flex;flex-direction:column;justify-content:space-between;max-width:100%;container-type:inline-size}
.pair .st b{font:400 clamp(26px,17cqw,48px)/.95 var(--display);text-transform:uppercase}
.pair .st span{font-size:13px;line-height:1.4}
.pair p{padding:9px 12px;background:var(--surface);border-top:1px solid var(--line-2);font:500 12px var(--sans);color:var(--ink-2);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pair p b{color:var(--ink)}
.pair.no .st{position:relative}
.pair.no .st::after{content:"";position:absolute;inset:0;background:linear-gradient(to top right,transparent calc(50% - 1px),var(--accent) calc(50% - 1px),var(--accent) calc(50% + 1px),transparent calc(50% + 1px))}

/* type */
.fonts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.font-card{border:1px solid var(--line-2);background:var(--surface);display:flex;flex-direction:column;min-width:0}
.font-card.dark{background:#123E5E;border-color:#123E5E;color:#F3EDE1}
.font-card.red{background:#800000;border-color:#800000;color:#F3EDE1}
.font-card.dark .label,.font-card.red .label{color:#E8DCC4}
.font-spec{padding:20px;display:flex;flex-direction:column;gap:10px;min-height:340px;position:relative}
.font-spec .big{position:absolute;right:20px;top:14px;font-size:110px;line-height:1}
.font-spec .fam{font-size:30px;line-height:1.05;margin-top:auto}
.font-spec .wts{display:flex;gap:16px;font-size:15px;flex-wrap:wrap}
.font-spec .gl{font-size:14px;line-height:1.6;opacity:.85;overflow-wrap:anywhere}
.font-spec .use{font:400 13.5px/1.5 var(--sans);opacity:.85}
.font-spec .wm{width:62%;margin-top:6px}
.font-foot{border-top:1px solid var(--line-2);padding:12px;display:flex;flex-wrap:wrap;gap:6px}
.font-card.dark .font-foot{border-color:#2B5878}
.font-card.red .font-foot{border-color:#A33A33}
.font-card.dark .chip,.font-card.dark .btn{background:#0B2D46;border-color:#2B5878;color:#F3EDE1}
.font-card.red .chip,.font-card.red .btn{background:#640000;border-color:#A33A33;color:#F3EDE1}
.hier{border:1px solid var(--line-2);background:#E8DCC4;color:#123E5E;padding:clamp(22px,4vw,52px);display:flex;flex-direction:column;gap:22px;container-type:inline-size}
.hier .k{font:700 1.3cqw/1 var(--sans);font-size:max(11px,1.1cqw);letter-spacing:.16em;text-transform:uppercase;color:#800000}
.hier .h{font:400 clamp(44px,9cqw,120px)/.95 var(--display);text-transform:uppercase}
.hier .b{font:400 clamp(16px,1.8cqw,21px)/1.5 var(--sans);max-width:46ch;color:#3E5566}
.hier .wm{width:clamp(110px,17cqw,200px);color:#800000}
.hier .row{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.hier .cta{font:700 15px/1 var(--sans);background:#800000;color:#F3EDE1;padding:14px 20px;display:inline-block}
.scale-wrap,.tbl-wrap{overflow-x:auto;border:1px solid var(--line-2);background:var(--surface)}

const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const COPY_ICON = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="5" y="5" width="9" height="9"/><path d="M11 5V2H2v9h3"/></svg>';
const fs = s => s.replace(/"/g,"'");
const NAMES = {"#A9CBE6":"Sky","#123E5E":"Ocean","#800000":"Sunset","#E8DCC4":"Sand","#000000":"Black","#FFFFFF":"White"};
const nameOf = h => NAMES[h.toUpperCase()] || h;
const hexOf = n => (BRAND.colors.find(c=>c.name===n)||{}).hex;
const logoFile = (k, fill) => LOGO[k].replace(/__FILL__/g, fill);
const logo = (k, fill) => logoFile(k, fill || 'currentColor').replace('<svg ', `<svg class="logo" role="img" aria-label="STUFFT ${k}" `);
const rgbOf = h => { h=h.replace('#',''); return [0,2,4].map(i=>parseInt(h.slice(i,i+2),16)); };
function hslOf([r,g,b]){ r/=255;g/=255;b/=255; const mx=Math.max(r,g,b),mn=Math.min(r,g,b); let h=0,s=0; const l=(mx+mn)/2; if(mx!==mn){const d=mx-mn; s=l>.5?d/(2-mx-mn):d/(mx+mn); h=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4; h*=60;} return [Math.round(h),Math.round(s*100),Math.round(l*100)]; }
function cmykOf([r,g,b]){ r/=255;g/=255;b/=255; const k=1-Math.max(r,g,b); if(k>=1) return [0,0,0,100]; return [r,g,b].map(v=>Math.round((1-v-k)/(1-k)*100)).concat(Math.round(k*100)); }
const lum = rgb => { const a=rgb.map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)}); return .2126*a[0]+.7152*a[1]+.0722*a[2]; };
const ratio = (a,b) => { const [x,y]=[lum(rgbOf(a)),lum(rgbOf(b))].sort((m,n)=>n-m); return (x+.05)/(y+.05); };
const inkOn = h => ratio(h,C.sand) >= ratio(h,C.ocean) ? C.sand : C.ocean;
const grade = r => r>=7?'AAA':r>=4.5?'AA':r>=3?'AA large':'Fails';

let toastT;
function toast(msg, sw){ const t=$('#toast'); t.innerHTML=(sw?`<i style="background:${sw}"></i>`:'')+esc(msg); t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800); }
function fallbackCopy(text){ const ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select(); let ok=false; try{ ok=document.execCommand('copy'); }catch(e){} ta.remove(); return ok; }
function copy(text, label, sw){ const done=()=>toast(label||('Copied '+text), sw); const fail=()=>{ if(fallbackCopy(text)) done(); else toast('Copy is blocked here. Select the text and copy it by hand'); }; try{ navigator.clipboard.writeText(text).then(done, fail); }catch(e){ fail(); } }
const STORE = []; const ref = t => { STORE.push(t); return STORE.length-1; };
const chip = (text, label, sw) => `<button type="button" class="chip" data-copy="${esc(text)}"${label?` data-label="${esc(label)}"`:''}${sw?` data-swatch="${sw}"`:''}>${esc(text)}${COPY_ICON}</button>`;
const head = (label, title, intro) => `<div class="sec-head"><span class="label">${label}</span><h2>${title}</h2><p>${intro}</p></div>`;
const rulesHTML = list => `<div class="rules">${list.map(([t,d],i)=>`<div class="rule"><span class="n">${String(i+1).padStart(2,'0')}</span><h3>${t}</h3><p>${d}</p></div>`).join('')}</div>`;

/* downloads */
let DL = null; const DLS = [];
const dlBtn = (label, filename, make, cls) => { DLS.push({filename, make}); return `<button type="button" class="btn dlb${cls?' '+cls:''}" data-dl="${DLS.length-1}" hidden>${label} ↓</button>`; };
async function saveFile(i){
  const d = DLS[i]; if(!DL){ toast('Downloads are not available in this view'); return; }
  try{ await DL.save({filename:d.filename, data: await d.make()}); toast('Saved ' + d.filename); }
  catch(e){ const c=e&&e.code; if(c==='declined') return; toast(c==='rate_limited'?'Another download is waiting. Try again in a moment':'That download did not work here. Use Copy SVG instead'); }
}
const fetchFile = name => () => fetch(name).then(r => { if(!r.ok) throw new Error('missing'); return r.blob(); });
function svgToPng(svg, width, bg){
  return new Promise((res, rej) => {
    const vb = svg.match(/viewBox="([^"]+)"/)[1].split(/[\s,]+/).map(Number);
    const pad = bg ? Math.round(width*0.2) : 0, inner = width-pad*2, h = Math.round(inner*vb[3]/vb[2]);
    const W = width, H = bg ? width : h, img = new Image();
    img.onload = () => { const c=document.createElement('canvas'); c.width=W; c.height=H; const x=c.getContext('2d'); if(bg){ x.fillStyle=bg; x.fillRect(0,0,W,H); } x.drawImage(img,pad,(H-h)/2,inner,h); c.toBlob(b=>b?res(b):rej(new Error('png')),'image/png'); };
    img.onerror = rej;
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg.replace('<svg ', `<svg width="${inner}" height="${h}" `));
  });
}
document.addEventListener('click', e => {
  const d = e.target.closest('[data-dl]'); if(d){ saveFile(+d.dataset.dl); return; }
  const b = e.target.closest('[data-copy],[data-copyref]'); if(!b) return;
  copy(b.dataset.copyref!=null ? STORE[+b.dataset.copyref] : b.dataset.copy, b.dataset.label, b.dataset.swatch);
});

/* zip of every logo file, built in the page */
const CRC_T = (()=>{ const t=new Uint32Array(256); for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=c&1?0xEDB88320^(c>>>1):c>>>1; t[n]=c>>>0; } return t; })();
const crc32 = b => { let c=0xFFFFFFFF; for(let i=0;i<b.length;i++) c=CRC_T[(c^b[i])&255]^(c>>>8); return (c^0xFFFFFFFF)>>>0; };
function makeZip(files){
  const enc=new TextEncoder(), parts=[], central=[]; let off=0;
  for(const [name,text] of files){
    const nb=enc.encode(name), db=enc.encode(text), crc=crc32(db);
    const h=new DataView(new ArrayBuffer(30)); h.setUint32(0,0x04034b50,true); h.setUint16(4,20,true); h.setUint32(14,crc,true); h.setUint32(18,db.length,true); h.setUint32(22,db.length,true); h.setUint16(26,nb.length,true);
    parts.push(new Uint8Array(h.buffer), nb, db);
    const c=new DataView(new ArrayBuffer(46)); c.setUint32(0,0x02014b50,true); c.setUint16(4,20,true); c.setUint16(6,20,true); c.setUint32(16,crc,true); c.setUint32(20,db.length,true); c.setUint32(24,db.length,true); c.setUint16(28,nb.length,true); c.setUint32(42,off,true);
    central.push(new Uint8Array(c.buffer), nb); off += 30+nb.length+db.length;
  }
  const cs=central.reduce((a,b)=>a+b.length,0), e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true); e.setUint16(8,files.length,true); e.setUint16(10,files.length,true); e.setUint32(12,cs,true); e.setUint32(16,off,true);
  return new Blob(parts.concat(central,[new Uint8Array(e.buffer)]),{type:'application/zip'});
}
const PACK_COLS = [['sunset',C.sunset],['ocean',C.ocean],['sand',C.sand],['black',C.black],['white',C.white]];
function logoPack(){
  const files=[];
  for(const k of ['lockup','wordmark','symbol']) for(const [n,h] of PACK_COLS) files.push([`STUFFT-logo-svg/${k}/stufft-${k}-${n}.svg`, logoFile(k,h)]);
  files.push(['STUFFT-logo-svg/README.txt',`STUFFT logo files (SVG) · brand guidelines ${BRAND.version}\n\nlockup    the bloom above the wordmark. The default.\nwordmark  STUFFT on its own, for wide and small spaces.\nsymbol    the bloom on its own: zip pull, deboss, avatar.\n\nsunset  #800000  on Sand or Sky\nsand    #E8DCC4  on Sunset or Ocean\nocean   #123E5E  one-colour use on light grounds\nblack   #000000  one-colour print, engraving\nwhite   #FFFFFF  one-colour on photos\n\nNever Sunset on Ocean. Clear space: the height of the S on every side.\n`]);
  return makeZip(files);
}

/* tokens */
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/-$/,'');
function tokensCSS(){
  const core = BRAND.colors.map(c=>`  --color-${slug(c.name)}: ${c.hex};`).join('\n');
  const ramps = BRAND.ramps.map(r=>r.steps.map((h,i)=>`  --${slug(r.name)}-${(i+1)*100}: ${h};`).join('\n')).join('\n');
  const fonts = BRAND.fonts.map(f=>`  ${f.css}: ${f.stack};`).join('\n');
  return `/* STUFFT brand tokens · guidelines ${BRAND.version} */\n:root {\n${core}\n${ramps}\n${fonts}\n}`;
}
function tokensJSON(){
  return JSON.stringify({ brand:"STUFFT", version:BRAND.version,
    color:Object.fromEntries(BRAND.colors.map(c=>[slug(c.name),c.hex])),
    mix:Object.fromEntries(BRAND.proportion.map(([n,p])=>[slug(n),p+'%'])),
    shades:Object.fromEntries(BRAND.ramps.map(r=>[slug(r.name),r.steps])),
    font:Object.fromEntries(BRAND.fonts.map(f=>[f.css.replace('--font-',''),f.family])),
    type:Object.fromEntries(BRAND.scale.map(s=>[slug(s.role),{font:BRAND.fonts[s.font].family,size:s.px+'px',lineHeight:s.lh,weight:s.weight,tracking:s.track,uppercase:!!s.upper,print:s.print}]))
  }, null, 2);
}

function setMode(m, save){
  document.documentElement.setAttribute('data-theme', m);

  if(save){ try{ localStorage.setItem('stufft-portal-mode', m); }catch(e){} }
}

if(saved==='dark'||saved==='light') setMode(saved,false); else document.querySelectorAll('.theme button').forEach(b=>b.setAttribute('aria-pressed', b.dataset.mode === (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')));

const VALID = ['home'].concat(PAGES.map(p=>p[0]));
function route(){
  const id = VALID.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'home';
  document.querySelectorAll('#main > section').forEach(s => s.hidden = s.id !== id);
  document.querySelectorAll('.nav a').forEach(a => { const on=a.dataset.id===id; a.classList.toggle('on',on); if(on) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  window.scrollTo(0,0);
  const on = document.querySelector('.nav a.on'); if(on && window.innerWidth < 900) on.parentNode.scrollTo({left:on.offsetLeft-16});
}
window.addEventListener('hashchange', route);
route();

(async () => {
  try{ DL = window.claude && window.claude.use ? await window.claude.use("downloads") : null; }catch(e){ DL = null; }
  if(!DL){ /* normal website: save through the browser */
    DL = { save: async ({filename, data}) => {
      const blob = data instanceof Blob ? data : new Blob([data], {type: filename.endsWith('.svg') ? 'image/svg+xml' : filename.endsWith('.json') ? 'application/json' : 'text/plain'});
      const u = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(u), 4000);
    }};
  }
  document.querySelectorAll('.dlb').forEach(b => b.hidden = !DL);
  const n = $('#dlNote'); if(n) n.hidden = !!DL;
})();
